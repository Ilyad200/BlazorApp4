name: blazorapp4

services:
  blazorapp4:
    container_name: blazorapp4
    image: ${DOCKER_REGISTRY-}blazorapp4
    build:
      context: .
      dockerfile: BlazorApp4/BlazorApp4/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OpenRouter__ApiKey=${OPENROUTER_APIKEY}
      # Добавляем адрес Ollama для внутреннего общения между контейнерами
      - Ollama__Endpoint=http://ollama:11434
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8080:8081"
    depends_on:
      - db
      - ollama # Ждем запуска ollama перед стартом приложения
    restart: unless-stopped

  db:
    image: postgres:latest
    container_name: db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      # Исправлен путь на стандартный и более безопасный для PostgreSQL
      - postgres_data:/var/lib/postgresql
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434" # Порт для доступа к API Ollama
    volumes:
      - ollama_data:/root/.ollama # Сохраняем модели, чтобы не скачивать их каждый раз
    restart: unless-stopped
    # При первом запуске скачиваем легкую модель, затем запускаем сервер
    # command: sh -c "ollama pull all-minilm && ollama serve"

volumes:
  postgres_data:
  ollama_data: # Новый том для хранения весов моделей Ollama